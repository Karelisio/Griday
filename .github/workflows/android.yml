name: APK Android

# À chaque push : l'APK « pub » (publicités AdMob + achat Premium).
# - Release signée (APK + AAB) si les secrets ANDROID_KEYSTORE_* sont définis, avec les vrais identifiants AdMob ;
#   sinon APK de debug (clé de debug, installable directement) et annonces de TEST uniquement.
# - Tag « v* » : APK et AAB joints à une release GitHub.
# L'APK « perso » (VITE_ADS=false : sans publicité ni achat, tout débloqué) n'est construit qu'à la demande
# (lancement manuel, case « perso ») et n'est jamais joint à une release : sur un dépôt public, les artefacts
# sont téléchargeables par tout compte GitHub.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      perso:
        description: 'Construire aussi l’APK perso (sans pub, tout débloqué) — artefact visible de quiconque peut lire le dépôt'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # Les tags vont au bout ; un nouveau push sur une branche remplace le build en cours.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  apk:
    name: APK ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # release GitHub sur un tag
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.perso && '["pub","perso"]' || '["pub"]') }}
    env:
      VITE_ADS: ${{ matrix.variant == 'perso' && 'false' || 'true' }}
      VITE_PREMIUM_PRODUCT_ID: ${{ vars.PREMIUM_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # Avant le build web : le type de build décide des identifiants AdMob (réels seulement en release signée).
      - name: Keystore et identifiants AdMob
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
              echo "::error::Secret ANDROID_KEYSTORE_PASSWORD manquant (mot de passe du keystore)."
              exit 1
            fi
            # (Sortie lue avant filtrage : sans pipefail, l'échec de keytool dans un tube passerait inaperçu.)
            if ! listing=$(keytool -J-Duser.language=en -list -v -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1); then
              echo "::error::Keystore illisible : ANDROID_KEYSTORE_BASE64 (base64 -w0 du fichier .jks) ou ANDROID_KEYSTORE_PASSWORD incorrect."
              exit 1
            fi
            aliases=$(printf '%s\n' "$listing" | sed -n 's/^Alias name: //p')
            alias="$ANDROID_KEY_ALIAS"
            if [ -z "$alias" ]; then
              # Alias non fourni : celui de l'unique clé du keystore.
              if [ "$(printf '%s\n' "$aliases" | grep -c .)" -ne 1 ]; then
                echo "::error::Secret ANDROID_KEY_ALIAS manquant, et le keystore ne contient pas une seule clé (alias : $(echo $aliases))."
                exit 1
              fi
              alias="$aliases"
              echo "::notice::Alias de signature déduit du keystore : $alias"
            elif ! printf '%s\n' "$aliases" | grep -qxF "$alias"; then
              echo "::error::Alias « $alias » absent du keystore (secret ANDROID_KEY_ALIAS) ; alias présents : $(echo $aliases)."
              exit 1
            fi
            {
              echo "ANDROID_KEYSTORE_PATH=$keystore"
              echo "ANDROID_KEY_ALIAS=$alias"
              echo "BUILD_TYPE=release"
            } >> "$GITHUB_ENV"
            if [ "$VITE_ADS" = true ]; then
              if [ -n "$ADMOB_APP_ID" ] && [ -n "$ADMOB_REWARDED_ID" ] && [ -n "$ADMOB_INTERSTITIAL_ID" ]; then
                {
                  echo "ADMOB_APP_ID=$ADMOB_APP_ID"
                  echo "VITE_ADMOB_REWARDED_ID=$ADMOB_REWARDED_ID"
                  echo "VITE_ADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID"
                } >> "$GITHUB_ENV"
              elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
                echo "::error::Release publiée sans identifiants AdMob (secrets ADMOB_APP_ID, ADMOB_REWARDED_ID, ADMOB_INTERSTITIAL_ID) : elle ne servirait que des annonces de test."
                exit 1
              else
                echo "::warning::Release signée sans identifiants AdMob : annonces de test uniquement."
              fi
            fi
          else
            echo "::notice::Pas de keystore (secret ANDROID_KEYSTORE_BASE64) : APK de debug, annonces de test."
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi

      - name: Build web (${{ matrix.variant }})
        run: npm run build

      - name: Synchronisation Capacitor
        run: npx cap sync android

      - name: Gradle
        working-directory: android
        env:
          # (Alias : celui validé à l'étape « Keystore », déjà dans l'environnement.)
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = release ]; then
            ./gradlew --no-daemon --console=plain assembleRelease bundleRelease
          else
            ./gradlew --no-daemon --console=plain assembleDebug
          fi

      - name: Fichiers à publier
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          for f in android/app/build/outputs/apk/*/*.apk; do
            cp "$f" "out/griday-$version-${{ matrix.variant }}-$BUILD_TYPE.apk"
          done
          if [ "$BUILD_TYPE" = release ]; then
            cp android/app/build/outputs/bundle/release/*.aab "out/griday-$version-${{ matrix.variant }}.aab"
          fi
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: griday-${{ matrix.variant }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      # Release GitHub (CLI gh du runner, aucune action tierce) : seulement l'APK « pub ».
      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v') && matrix.variant == 'pub'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --generate-notes --verify-tag
          fi
