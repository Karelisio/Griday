name: APK Android

# Deux variantes à chaque push :
# - « pub »   : publicités AdMob + achat Premium (blocs réels si les secrets sont définis, sinon blocs de test) ;
# - « perso » : VITE_ADS=false, sans publicité ni achat (plugins de monétisation exclus du projet Android).
# Signature : keystore de publication si les secrets ANDROID_KEYSTORE_* sont définis (APK + AAB de release),
# sinon APK de debug (signé avec une clé de debug, installable directement).
# Tag « v* » : les fichiers sont joints à une release GitHub.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # Les tags vont au bout ; un nouveau push sur une branche remplace le build en cours.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  apk:
    name: APK ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [pub, perso]
    env:
      VITE_ADS: ${{ matrix.variant == 'perso' && 'false' || 'true' }}
      VITE_ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      VITE_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      VITE_PREMIUM_PRODUCT_ID: ${{ vars.PREMIUM_PRODUCT_ID }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Build web (${{ matrix.variant }})
        run: npm run build

      - name: Synchronisation Capacitor
        run: npx cap sync android

      - name: Keystore de publication
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "::notice::Pas de keystore (secret ANDROID_KEYSTORE_BASE64) : APK de debug."
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi

      - name: Gradle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = release ]; then
            ./gradlew --no-daemon --console=plain assembleRelease bundleRelease
          else
            ./gradlew --no-daemon --console=plain assembleDebug
          fi

      - name: Fichiers à publier
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          for f in android/app/build/outputs/apk/*/*.apk; do
            cp "$f" "out/griday-$version-${{ matrix.variant }}-$BUILD_TYPE.apk"
          done
          if [ "$BUILD_TYPE" = release ]; then
            cp android/app/build/outputs/bundle/release/*.aab "out/griday-$version-${{ matrix.variant }}.aab"
          fi
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: griday-${{ matrix.variant }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
