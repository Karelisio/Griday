name: Validation du moteur

on:
  push:
  pull_request:
  # Chaque lundi : la fenêtre de 10 ans avance même sans nouveau commit.
  # (GitHub suspend les tâches planifiées d'un dépôt public inactif depuis 60 jours.)
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Seules les PR annulent l'exécution précédente ; push, planification et lancements manuels vont au bout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Tests + validation long terme
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historique complet : comparaison des références avec la révision de base

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      # Références figées en ajout seul (contournement avant lancement : « [golden-reset] »).
      - name: Références en ajout seul
        if: (success() || failure()) && (github.event_name == 'push' || github.event_name == 'pull_request')
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GOLDEN_RESET: ${{ (contains(github.event.head_commit.message, '[golden-reset]') || contains(github.event.pull_request.title, '[golden-reset]')) && '1' || '' }}
        run: npx tsx scripts/check-golden.ts "$BASE"

      # Lancée même si un test unitaire échoue, pour un diagnostic complet.
      - name: Validation des 10 prochaines années (+ références figées)
        if: success() || failure()
        run: npm run validate:future -- --report=validate-report.json

      - name: Rapport de validation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validate-report
          path: validate-report.json
          if-no-files-found: warn
