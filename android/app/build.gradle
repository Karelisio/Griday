apply plugin: 'com.android.application'

// Version : package.json fait foi. versionName = version npm (relue par l'app via App.getInfo()) ;
// versionCode = M*10000 + m*100 + p (0.1.0 donne 100), surchargeable : ./gradlew assembleRelease -PversionCode=N.
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def semver = (packageJson.version =~ /^(\d+)\.(\d+)\.(\d+)/)
if (!semver.find()) {
    throw new GradleException("package.json : version semver attendue, trouvée '${packageJson.version}'")
}
def appVersionCode = (findProperty('versionCode') ?: (semver.group(1).toInteger() * 10000 + semver.group(2).toInteger() * 100 + semver.group(3).toInteger())).toString().toInteger()

// AdMob : identifiant d'application réel via ADMOB_APP_ID (ou -PadmobAppId=…), sinon celui de test de Google
// (annonces de test uniquement : sans risque pour le compte, jamais rémunérées).
def admobTestAppId = 'ca-app-pub-3940256099942544~3347511713'
def admobAppId = (findProperty('admobAppId') ?: System.getenv('ADMOB_APP_ID') ?: admobTestAppId).toString().trim()
if (!(admobAppId ==~ /ca-app-pub-\d+~\d+/)) {
    throw new GradleException("ADMOB_APP_ID invalide (format attendu : ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY)")
}

android {
    namespace = "io.github.karelisio.griday"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.karelisio.griday"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName packageJson.version
        manifestPlaceholders += [admobAppId: admobAppId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signature de publication : keystore fourni par la CI (ANDROID_KEYSTORE_PATH et mots de passe), jamais versionné.
    def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    def releaseSigned = keystorePath && file(keystorePath).exists()
    signingConfigs {
        if (releaseSigned) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigned) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
